# Docker Compose para producción
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agua-db
    environment:
      POSTGRES_USER: ${DB_USER:-agua}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agua123}
      POSTGRES_DB: ${DB_NAME:-agua}
    volumes:
      - ./db_backups:/docker-entrypoint-initdb.d
      - agua_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agua} -d ${DB_NAME:-agua}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: agua-app
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-agua}:${DB_PASSWORD:-agua123}@db:5432/${DB_NAME:-agua}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: "true"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: agua-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: agua-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  agua_data:
